## 利用GitHub Actions每天定时给百度推送链接，提高收录率 ##

name: pushUrl

# 两种触发方式：一、push代码，二、每天国际标准时间23点（北京时间+8即早上7点）运行
on:
  push:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      unconditional-invoking:
        description: 'push url unconditionally'
        type: boolean
        required: true
        default: true

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v7

      # Python 3.8 is unavailable on the current Ubuntu 26.04 runner.
      # The script uses only standard-library modules and requests, so use a
      # currently supported Python runtime.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Push
        env:
          URL: ${{ secrets.URL }}
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          if [ -n "$URL" ]; then
            if [ -n "$BAIDU_TOKEN" ]; then
              python pushUrl.py --url "$URL" --baidu_token "$BAIDU_TOKEN"
            else
              echo "请前往 Github Action Secrets 配置 BAIDU_TOKEN:"
              echo "详情参见: 'https://www.ghlcode.cn/fe032806-5362-4d82-b746-a0b26ce8b9d9'"
            fi
            if [ -n "$BING_API_KEY" ]; then
              python pushUrl.py --url "$URL" --bing_api_key "$BING_API_KEY"
            else
              echo "请前往 Github Action Secrets 配置 BING_API_KEY:"
              echo "详情参见: 'https://www.ghlcode.cn/fe032806-5362-4d82-b746-a0b26ce8b9d9'"
            fi
          else
            echo "请前往 Github Action Secrets 配置 URL:"
            echo "详情参见: 'https://www.ghlcode.cn/fe032806-5362-4d82-b746-a0b26ce8b9d9'"
          fi
